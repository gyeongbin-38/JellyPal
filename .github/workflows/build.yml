name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend harness
        run: node _sim.cjs
      - name: Rust check + tests
        working-directory: src-tauri
        run: |
          cargo check
          cargo test

  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The app is unsigned, so Apple Silicon flags it "damaged" once the
      # browser quarantine bit lands. Rebuild the dmg ourselves with a
      # fixer script + README inside so the cure sits next to the app.
      - name: Repack dmg with quarantine fixer
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ROOT="$RUNNER_TEMP/dmgroot"
          OUT="src-tauri/target/release/bundle/dmg"
          mkdir -p "$ROOT" "$OUT"
          tar -xzf "src-tauri/target/release/bundle/macos/Jellypal.app.tar.gz" -C "$ROOT"
          ln -s /Applications "$ROOT/Applications"
          cat > "$ROOT/Fix-Jellypal.command" <<'EOF'
          #!/bin/sh
          # Jellypal is unsigned — macOS quarantines browser downloads and
          # reports the app "damaged". This strips the quarantine flag.
          APP="/Applications/Jellypal.app"
          [ -d "$APP" ] || APP="$HOME/Applications/Jellypal.app"
          if [ -d "$APP" ]; then
            xattr -dr com.apple.quarantine "$APP" 2>/dev/null
            echo "Fixed — opening Jellypal."
            open "$APP"
          else
            echo "Drag Jellypal.app to Applications first, then run me again."
          fi
          read -n1 -s -r -p "Press any key to close"
          EOF
          chmod +x "$ROOT/Fix-Jellypal.command"
          cat > "$ROOT/README FIRST.txt" <<'EOF'
          Jellypal — macOS install

          1. Drag Jellypal.app onto the Applications shortcut.
          2. macOS may say the app is "damaged" — it isn't; the app is
             unsigned and Apple Silicon refuses quarantined unsigned apps.
             Either double-click "Fix-Jellypal.command" (right-click ->
             Open if needed), or run this once in Terminal:

               xattr -cr /Applications/Jellypal.app

          3. Done — Jellypal asks for no permissions at all. It earns
             jelly on a passive drip while it runs.
          EOF
          hdiutil create -volname Jellypal -srcfolder "$ROOT" -ov -format UDZO \
            "$OUT/Jellypal_${VER}_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: jellypal-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/Jellypal.app.tar.gz
          retention-days: 14
      - name: Smoke test — launch app, verify it stays alive
        run: |
          BIN="src-tauri/target/release/bundle/macos/Jellypal.app/Contents/MacOS/jellypal"
          "$BIN" &
          APP_PID=$!
          sleep 20
          if kill -0 $APP_PID 2>/dev/null; then
            echo "PASS: jellypal alive after 20s (pid $APP_PID)"
            kill $APP_PID || true
          else
            echo "FAIL: jellypal exited early"
            wait $APP_PID || true
            exit 1
          fi
          LOGDIR="$HOME/Library/Application Support/com.jellypal.desktop"
          ls -la "$LOGDIR" 2>/dev/null || true
          cat "$LOGDIR/crash.log" 2>/dev/null | tail -20 || true
          cat "$LOGDIR/hook.log" 2>/dev/null | tail -10 || true

  # App Store flavor: same codebase, different manifest. macos-private-api
  # is physically removed from Cargo.toml so no private symbols reach the
  # binary, then the store config (sandbox entitlements, opaque card
  # window, com.jellypal.store) merges over tauri.conf.json.
  store:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Strip private API for store build
        run: sed -i '' 's/, "macos-private-api"//' src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.store.conf.json --features store --bundles app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: jellypal-store
          path: src-tauri/target/release/bundle/macos/Jellypal.app.tar.gz
          retention-days: 14
      - name: Smoke test — launch store app, verify it stays alive
        run: |
          BIN="src-tauri/target/release/bundle/macos/Jellypal.app/Contents/MacOS/jellypal"
          "$BIN" &
          APP_PID=$!
          sleep 20
          if kill -0 $APP_PID 2>/dev/null; then
            echo "PASS: store build alive after 20s (pid $APP_PID)"
            kill $APP_PID || true
          else
            echo "FAIL: store build exited early"
            exit 1
          fi
