name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Verify an existing jellypal-store artifact on Intel and Apple silicon; leave empty to build'
        required: false
        type: string
        default: ''
      store_only:
        description: 'Build only the macOS store candidate'
        required: false
        type: boolean
        default: false

jobs:
  check:
    if: inputs.artifact_run_id == '' && !inputs.store_only
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend harness
        run: npm test
      - name: Rust check + tests
        working-directory: src-tauri
        run: |
          cargo check
          cargo test

  layout:
    if: inputs.artifact_run_id == '' && !inputs.store_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
        env:
          JELLYPAL_LAYOUT_OUTPUT: ${{ runner.temp }}/jellypal-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jellypal-layout
          path: ${{ runner.temp }}/jellypal-layout
          retention-days: 14

  bundle:
    if: inputs.artifact_run_id == '' && !inputs.store_only
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tauri leaves the bundle with only a linker signature, which fails
      # bundle verification. Seal the app before packaging it for download.
      - name: Repack dmg with quarantine fixer
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ROOT="$RUNNER_TEMP/dmgroot"
          OUT="src-tauri/target/release/bundle/dmg"
          B="src-tauri/target/release/bundle/macos"
          mkdir -p "$ROOT" "$OUT"
          codesign --force --sign - --identifier com.jellypal.desktop "$B/Jellypal.app"
          codesign --verify --deep --strict "$B/Jellypal.app"
          tar -czf "$B/Jellypal.app.tar.gz" -C "$B" Jellypal.app
          ditto "$B/Jellypal.app" "$ROOT/Jellypal.app"
          codesign --verify --deep --strict "$ROOT/Jellypal.app"
          ln -s /Applications "$ROOT/Applications"
          cat > "$ROOT/Fix-Jellypal.command" <<'EOF'
          #!/bin/sh
          # Jellypal is not Developer ID signed or notarized. Browser
          # downloads may be blocked until the quarantine flag is removed.
          APP="/Applications/Jellypal.app"
          [ -d "$APP" ] || APP="$HOME/Applications/Jellypal.app"
          if [ -d "$APP" ]; then
            xattr -dr com.apple.quarantine "$APP" 2>/dev/null
            echo "Fixed — opening Jellypal."
            open "$APP"
          else
            echo "Drag Jellypal.app to Applications first, then run me again."
          fi
          printf "Press Enter to close"
          read _
          EOF
          chmod +x "$ROOT/Fix-Jellypal.command"
          cat > "$ROOT/README FIRST.txt" <<'EOF'
          Jellypal — macOS install

          1. Drag Jellypal.app onto the Applications shortcut.
          2. macOS may say the app is "damaged" — it isn't; the app is
             not Developer ID signed or notarized.
             Either double-click "Fix-Jellypal.command" (right-click ->
             Open if needed), or run this once in Terminal:

               xattr -cr /Applications/Jellypal.app

          3. Done — Jellypal asks for no permissions at all. It earns
             jelly on a passive drip while it runs.
          EOF
          hdiutil create -volname Jellypal -srcfolder "$ROOT" -ov -format UDZO \
            "$OUT/Jellypal_${VER}_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: jellypal-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/Jellypal.app.tar.gz
          retention-days: 14
      - name: Smoke test — launch app, verify it stays alive
        run: |
          BIN="src-tauri/target/release/bundle/macos/Jellypal.app/Contents/MacOS/jellypal"
          "$BIN" &
          APP_PID=$!
          sleep 20
          if kill -0 $APP_PID 2>/dev/null; then
            echo "PASS: jellypal alive after 20s (pid $APP_PID)"
            kill $APP_PID || true
          else
            echo "FAIL: jellypal exited early"
            wait $APP_PID || true
            exit 1
          fi
          LOGDIR="$HOME/Library/Application Support/com.jellypal.desktop"
          ls -la "$LOGDIR" 2>/dev/null || true
          cat "$LOGDIR/crash.log" 2>/dev/null | tail -20 || true
          cat "$LOGDIR/hook.log" 2>/dev/null | tail -10 || true

  # App Store flavor: same codebase, different manifest. macos-private-api
  # is physically removed from Cargo.toml so no private symbols reach the
  # binary, then the store config (sandbox entitlements, opaque card
  # window, com.jellypal.store) merges over tauri.conf.json.
  store:
    if: inputs.artifact_run_id == ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Prepare macOS-only store build
        run: npm run prepare:store
      - name: Test native store backend
        run: |
          export TAURI_CONFIG="$(cat src-tauri/tauri.store.conf.json)"
          cargo test --locked --features store --lib --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.store.conf.json --features store --bundles app --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp CFBundleVersion for App Store uploads
        # every upload needs a unique monotonic build number; the workflow
        # run number gives that for free — re-tar so the artifact carries it
        run: |
          B="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          lipo "$B/Jellypal.app/Contents/MacOS/jellypal" -verify_arch x86_64 arm64
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$B/Jellypal.app/Contents/Info.plist"
          tar -czf "$B/Jellypal.app.tar.gz" -C "$B" Jellypal.app
      - uses: actions/upload-artifact@v4
        with:
          name: jellypal-store
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/Jellypal.app.tar.gz
          retention-days: 14
      - name: Smoke test — launch store app, verify it stays alive
        run: |
          BIN="src-tauri/target/universal-apple-darwin/release/bundle/macos/Jellypal.app/Contents/MacOS/jellypal"
          "$BIN" &
          APP_PID=$!
          sleep 20
          if kill -0 $APP_PID 2>/dev/null; then
            echo "PASS: store build alive after 20s (pid $APP_PID)"
            kill $APP_PID || true
          else
            echo "FAIL: store build exited early"
            exit 1
          fi

  verify-store:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jellypal-store
          path: store-artifact
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect Universal bundle
        run: |
          mkdir -p "$RUNNER_TEMP/store-check"
          tar -xzf store-artifact/Jellypal.app.tar.gz -C "$RUNNER_TEMP/store-check"
          bash src-tauri/macos-store/verify.sh "$RUNNER_TEMP/store-check/Jellypal.app"
          bash -n src-tauri/macos-store/sign.sh
      - name: Run with App Sandbox enabled
        run: |
          APP="$RUNNER_TEMP/store-check/Jellypal.app"
          codesign --force --sign - --entitlements src-tauri/macos-store/entitlements.plist "$APP"
          codesign --verify --deep --strict "$APP"
          codesign --display --entitlements - --xml "$APP" > "$RUNNER_TEMP/store-check/entitlements.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$RUNNER_TEMP/store-check/entitlements.plist" | grep -x true
          "$APP/Contents/MacOS/jellypal" > "$RUNNER_TEMP/store-check/stdout.log" 2> "$RUNNER_TEMP/store-check/stderr.log" &
          APP_PID=$!
          sleep 35
          kill -0 "$APP_PID"
          screencapture -x "$RUNNER_TEMP/store-check/native-screen.png" 2> "$RUNNER_TEMP/store-check/screenshot.log" || true
          kill "$APP_PID" || true
          echo "PASS: sandboxed store app stayed alive on $(uname -m)"
          STATE="$(find "$HOME/Library/Containers/com.jellypal.store" -name state.json -print -quit)"
          test -n "$STATE"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log("Sandbox save parsed")' "$STATE"
          LOG="$(find "$HOME/Library/Containers/com.jellypal.store" -name crash.log -print -quit)"
          test -n "$LOG"
          cp "$LOG" "$RUNNER_TEMP/store-check/frontend.log"
          grep -Eq '\] tick$' "$LOG"
          if grep -E 'JSERR|JSREJ|FRAME ' "$LOG"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-verification-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/store-check/*.log
            ${{ runner.temp }}/store-check/*.png
            ${{ runner.temp }}/store-check/entitlements.plist
          retention-days: 14
